proxy_port =
key_id =
key_key =

[advanced_proxy]
# 高级代理管理配置

# 每个代理最大使用次数（2分钟有效期）
max_requests_per_proxy = 8

# 预热请求数量
warmup_requests = 3

# 代理预取阈值：当可用代理少于此数量时获取新代理
proxy_fetch_threshold = 2

# 最小代理池大小
min_proxy_pool_size = 3

# 代理有效期（秒）- 110秒留10秒缓冲
proxy_validity_period = 110

# 是否启用代理预热
enable_proxy_warmup = True

# 预热成功率阈值
warmup_success_threshold = 0.67
